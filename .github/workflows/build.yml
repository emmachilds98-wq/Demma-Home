# Demma's Home V1 (docs/V1_PLAN.md Phases 0.4 and 7): on every pull request, build and check; on main, also publish the site to
# GitHub Pages; on a version tag (v1.1 ...), also put that version's PDFs on a GitHub Release. Outputs are never committed.
#
# V1.35 (docs/UPGRADE_REVIEW.md U10), the client: "Optimise the build process in order for GitHub uploads to not take so long": the
# three browser checks took 23 of the 25 minutes, one after another, and Pages waited for all of them. Now:
#   build    installs (Playwright's browser kept between runs), builds (the drawn renders kept between runs while what they're drawn
#            from is unchanged: tools/render_key.py; 96 of the build's 120 s), runs the quick checks (privacy on the built site among
#            them), and hands the site on. On main Pages publishes straight after: minutes, not half an hour. What's merged has
#            already passed every check on its pull request.
#   browser  the front door (site), the media wall's page (page) and the taps (taps), side by side, each on a machine of its own;
#            skipped when only documents changed (docs/, *.md).
name: Build, check and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # a pull request's newer push replaces its run; every merge to main publishes

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changes step compares with the base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media-wall/requirements.txt
      - name: Install
        id: install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fonts-inter
          python -m pip install -q -r media-wall/requirements.txt
          npm ci --no-audit --no-fund   # V1.29 (U4): three.js and esbuild for the site's one-file bundle (media-wall/src/vendor.py)
          echo "pw=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
          echo "renders=$(python tools/render_key.py)" >> "$GITHUB_OUTPUT"
      - name: Playwright's browser (kept between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.install.outputs.pw }}
      - run: python -m playwright install --with-deps chromium
      - name: The drawn renders (kept while what they're drawn from is unchanged)
        id: renders
        uses: actions/cache@v4
        with:
          path: |
            media-wall/src/art
            media-wall/src/*.svg
            media-wall/src/*.png
            media-wall/out/*.png
          key: renders-${{ steps.install.outputs.renders }}
      - name: The model's checks (fast, before the build)
        run: python tools/checks.py --quick
      - name: Build the site and the PDFs
        run: python tools/build.py ${{ steps.renders.outputs.cache-hit == 'true' && '--keep-renders' || '' }}
      - name: The quick checks on the built site (privacy, sizes)
        run: python tools/checks.py --only privacy,repo,sizes
      - name: Only documents changed? (then the browser checks rest)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then range="${{ github.event.before }}..${{ github.sha }}"
          else range=""; fi
          if [ -n "$range" ] && ! git diff --name-only $range | grep -qvE '^docs/|\.md$'; then echo "heavy=false"; else echo "heavy=true"; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Hand the site to the browser checks
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1
      - name: Keep the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            _site/media-wall/out/*.pdf
            _site/house/out/*.pdf
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  browser:
    needs: build
    if: needs.build.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [site, page, taps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media-wall/requirements.txt
      - name: Install
        id: install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fonts-inter
          python -m pip install -q -r media-wall/requirements.txt
          echo "pw=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.install.outputs.pw }}
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: The ${{ matrix.check }} check
        run: python tools/checks.py --only ${{ matrix.check }}
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.check }}
          path: _shots/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    # Settings → Pages → Build and deployment → Source: GitHub Actions (once, by the repo's owner)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs
      - uses: softprops/action-gh-release@v2
        with:
          name: Home Plan ${{ github.ref_name }}
          files: pdfs/**/*.pdf
