# Demma's Home V1 (docs/V1_PLAN.md Phases 0.4 and 7): on every pull request, build and check; on main, also publish the site to
# GitHub Pages; on a version tag (v1.1 ...), also put that version's PDFs on a GitHub Release. Outputs are never committed.
#
# V1.35 (docs/UPGRADE_REVIEW.md U10), the client: "Optimise the build process in order for GitHub uploads to not take so long": the
# three browser checks took 23 of the 25 minutes, one after another, and Pages waited for all of them. Now:
#   build    installs (Playwright's browser kept between runs), builds (the drawn renders kept between runs while what they're drawn
#            from is unchanged: tools/render_key.py; 96 of the build's 120 s), runs the quick checks (privacy on the built site among
#            them), and hands the site on. On main Pages publishes straight after: minutes, not half an hour. What's merged has
#            already passed every check on its pull request.
#   browser  the front door (site), the customisation (features, N257), the PC's walk (hitch), the media wall's page (page) and the
#            taps (taps), side by side, each on a machine of its own; skipped when only documents changed (docs/, *.md); hitch only when
#            the 3D, the house or the speed budget changed (N258).
# N258: one setup for every job (.github/actions/setup); the build fails if three.js fell back to the CDN; the bake is keyed on the
# code without its comments.
name: Build, check and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # a pull request's newer push replaces its run; every merge to main publishes

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
      checks: ${{ steps.changes.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changes step compares with the base
      - uses: ./.github/actions/setup
        id: setup
      - name: Install
        id: install
        run: |
          npm ci --no-audit --no-fund   # V1.29 (U4): three.js and esbuild for the site's one-file bundle (media-wall/src/vendor.py)
          echo "pw=${{ steps.setup.outputs.pw }}" >> "$GITHUB_OUTPUT"
          echo "renders=$(python tools/render_key.py)" >> "$GITHUB_OUTPUT"
      - name: The checks' names in the 3D's test door (N257, a second, no browser)
        run: python tools/check_site.py --dbg-names
      - name: The drawn renders (kept while what they're drawn from is unchanged)
        id: renders
        uses: actions/cache@v6
        with:
          path: |
            media-wall/src/art
            media-wall/src/*.svg
            media-wall/src/*.png
            media-wall/out/*.png
          key: renders-${{ steps.install.outputs.renders }}
      - name: The KTX2 photos made before (N196, by npm's ktx2-encoder; named by their JPEG, a few minutes to make them all again)
        uses: actions/cache/restore@v6
        with:
          path: .ktx2cache
          key: ktx2-
          restore-keys: ktx2-
      - name: The model's checks (fast, before the build)
        run: python tools/checks.py --quick
      - name: Build the site and the PDFs
        run: python tools/build.py ${{ steps.renders.outputs.cache-hit == 'true' && '--keep-renders' || '' }}
      - name: three.js bundled, not the CDN's (N258)
        run: |
          if ! ls _site/three.*.js >/dev/null 2>&1; then echo "::error::three.js fell back to the CDN (media-wall/src/vendor.py: esbuild or the packages missing); the build's log says why"; exit 1; fi
      - id: k2
        run: echo "key=ktx2-$(ls .ktx2cache 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"   # each named by its contents
      - name: Keep the KTX2 photos (a new entry only when they changed)
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .ktx2cache
          key: ${{ steps.k2.outputs.key }}
      # N195: the bounced light baked (house/bake.py: Blender's Cycles via bpy, which needs Python 3.13), kept while the house file and
      # its build are unchanged (a shell it doesn't match takes the mean bounce, so a stale bake never darkens a room)
      # N258: keyed on the code without its comments (esbuild prints the JS back without them; bake.py's # lines out), so a comment edit
      # doesn't re-run Blender
      - name: The baked light's key
        id: bakekey
        run: |
          js=$(cat media-wall/src/room3d/20_*.js | node_modules/.bin/esbuild --loader=js --log-level=error | sha1sum)
          py=$(python - <<'PY' | sha1sum
          import tokenize
          skip = (tokenize.COMMENT, tokenize.NL, tokenize.NEWLINE, tokenize.INDENT, tokenize.DEDENT)
          print(" ".join(t.string for t in tokenize.generate_tokens(open("house/bake.py").readline) if t.type not in skip))
          PY
          )
          echo "key=bake-$( (sha1sum < _site/data/house.json; echo "$js $py") | sha1sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - name: The baked light (kept)
        id: bakecache
        uses: actions/cache@v6
        with:
          path: _bake
          key: ${{ steps.bakekey.outputs.key }}
      - uses: actions/setup-python@v7
        if: steps.bakecache.outputs.cache-hit != 'true'
        id: py313
        with:
          python-version: "3.13"
          update-environment: false
      - name: Bake the light (when the house or its build changed)
        if: steps.bakecache.outputs.cache-hit != 'true'
        run: |
          ${{ steps.py313.outputs.python-path }} -m pip install -q bpy==5.3.0 numpy pillow "playwright==${{ steps.install.outputs.pw }}"
          ${{ steps.py313.outputs.python-path }} house/bake.py _site --size 1024 --samples 128 --keep _bake
      - name: The baked light into the site
        if: steps.bakecache.outputs.cache-hit == 'true'
        run: python house/bake.py _site --put _bake
      - name: The quick checks on the built site (privacy, sizes)
        run: python tools/checks.py --only privacy,repo,sizes
      - name: Only documents changed? (then the browser checks rest)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then range="${{ github.event.before }}..${{ github.sha }}"
          else range=""; fi
          if [ -n "$range" ] && ! git diff --name-only $range | grep -qvE '^docs/|\.md$'; then echo "heavy=false"; else echo "heavy=true"; fi >> "$GITHUB_OUTPUT"
          # N258: the PC's walk (hitch, the longest) only when the 3D, the house, the speed budget, the packages or CI changed
          if [ -n "$range" ] && ! git diff --name-only $range | grep -qE '^media-wall/src/[^/]*\.(py|js|css)$|^media-wall/src/room3d/|^house/|^tools/(check_site\.py|perf_budget\.json)$|^package|^\.github/'; then
            echo 'checks=["site","features","page","taps"]'; else echo 'checks=["site","features","hitch","page","taps"]'; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Hand the site to the browser checks
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 1
      - name: Keep the PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: |
            _site/media-wall/out/*.pdf
            _site/house/out/*.pdf
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
          include-hidden-files: true   # v4 on drops dotfiles unless asked; keeps _site/.nojekyll as v3 did

  browser:
    needs: build
    if: needs.build.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.build.outputs.checks) }}   # site, features (N257: the customisation, its own job), hitch (when the 3D changed), page, taps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site
      - name: The ${{ matrix.check }} check
        run: |
          if [ "${{ matrix.check }}" = features ]; then python tools/check_site.py _site --features; else python tools/checks.py --only ${{ matrix.check }}; fi
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.check }}
          path: _shots/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    # Settings → Pages → Build and deployment → Source: GitHub Actions (once, by the repo's owner)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pdfs
          path: pdfs
      - uses: softprops/action-gh-release@v3
        with:
          name: Home Plan ${{ github.ref_name }}
          files: pdfs/**/*.pdf
